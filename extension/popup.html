<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SmartBuy AI</title>
  <style>
    body { width: 320px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .header { background: linear-gradient(135deg, #1e40af, #06b6d4); color: white; padding: 16px; text-align: center; }
    .header h1 { font-size: 18px; margin: 0; }
    .header p { font-size: 12px; margin: 4px 0 0; opacity: 0.9; }
    .content { padding: 16px; }
    .status { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    .dot.inactive { background: #94a3b8; }
    .status-text { font-size: 13px; color: #475569; }
    .btn { display: block; width: 100%; padding: 10px; background: #1e40af; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; text-decoration: none; text-align: center; margin-top: 8px; }
    .btn:hover { background: #1e3a8a; }
    .stats { margin-top: 12px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="header">
    <h1>SmartBuy AI</h1>
    <p>Find better prices automatically</p>
  </div>
  <div class="content">
    <div class="status">
      <div class="dot" id="status-dot"></div>
      <span class="status-text" id="status-text">Checking page...</span>
    </div>
    <button class="btn" id="search-btn">Search for Better Prices</button>
    <a class="btn" href="https://smartbuy.ai/dashboard" target="_blank" style="background: #64748b;">Open Dashboard</a>
    <div class="stats" id="stats">
      <p>Supported sites: Amazon, Walmart, Best Buy, eBay, AliExpress</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
